name: Thumbnails
# Makes a quiz's thumbnails A and B in code (scripts/make_thumbnails.py; replaced the Canva template 10 Nov) and attaches
# them to the quiz's latest build release (build_result.json release_tag). The Build video workflow does this
# itself after each build; this is for re-making them on their own.
# Trigger: commit quizzes/<quiz>/thumbnails-request.json on a branch (any content), or run by hand once on main.
on:
  push:
    branches: ["claude/**"]
    paths: ["quizzes/*/thumbnails-request.json"]
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder, e.g. quiz-10"
        required: true
permissions:
  contents: write
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick quiz
        env:
          IN_QUIZ: ${{ inputs.quiz }}
          BEFORE: ${{ github.event.before }}
        run: |
          q="$IN_QUIZ"
          case "$BEFORE" in 0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD);; esac
          [ -n "$q" ] || q=$(git diff --name-only "$BEFORE" HEAD -- 'quizzes/*/thumbnails-request.json' | head -1 | cut -d/ -f2)
          case "$q" in ""|*/*|*..*) echo "No quiz"; exit 1;; esac
          echo "QUIZ=$q" >> "$GITHUB_ENV"
      - name: Make and attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          for f in "ofl/poppins/Poppins-Bold.ttf:Poppins-Bold.ttf" "ofl/lora/Lora-Italic%5Bwght%5D.ttf:Lora-Italic-Variable.ttf"; do
            sudo curl -fsSL -o "/usr/share/fonts/truetype/google-fonts/${f#*:}" "https://github.com/google/fonts/raw/main/${f%%:*}"
          done
          pip install -q pillow
          git pull -q origin "$GITHUB_REF_NAME" || true
          tag=$(jq -r '.review.video.release_tag // empty' "quizzes/$QUIZ/quiz.json")
          [ -n "$tag" ] || tag=$(jq -r '.release_tag // empty' "quizzes/$QUIZ/build_result.json" 2>/dev/null)
          test -n "$tag" || { echo "::error::No build release for $QUIZ yet"; exit 1; }
          python3 scripts/make_thumbnails.py --quiz "quizzes/$QUIZ" --out "$RUNNER_TEMP/thumbs"
          gh release upload "$tag" "$RUNNER_TEMP/thumbs/thumbnail-a.jpg" "$RUNNER_TEMP/thumbs/thumbnail-b.jpg" --clobber
          # public copies for the Studio task on Giulia's Mac (draft releases need a GitHub sign-in): release "thumbnails"
          for v in a b; do cp "$RUNNER_TEMP/thumbs/thumbnail-$v.jpg" "$RUNNER_TEMP/thumbs/$QUIZ-thumbnail-$v.jpg"; done
          gh release view thumbnails >/dev/null 2>&1 || gh release create thumbnails --prerelease --target main \
            --title "Thumbnails" --notes "Thumbnail A and B for each quiz (<quiz>-thumbnail-a.jpg / -b.jpg), for the YouTube Studio A/B test."
          gh release upload thumbnails "$RUNNER_TEMP/thumbs/$QUIZ-thumbnail-a.jpg" "$RUNNER_TEMP/thumbs/$QUIZ-thumbnail-b.jpg" --clobber
          { echo "## $QUIZ thumbnails attached to $tag"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ env.QUIZ }}
          path: ${{ runner.temp }}/thumbs/*.jpg
          retention-days: 14
