name: Post score comment
# Runs every hour,
# and posts the score comment on quiz videos that have gone public. Pinning stays manual (no API).
on:
  schedule:
    # hourly (UTC, no timezone key): the timed runs at release +15 min did not fire reliably, and Shorts
    # release twice a day. A run with nothing due finishes in seconds.
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Post comments
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/post_comment.py
      - name: Record comments
        run: |
          git add quizzes/*/upload.json quizzes/*/shorts-upload.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record score comments"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
