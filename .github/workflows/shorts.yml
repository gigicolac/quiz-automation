name: Shorts
# Cut a quiz's Shorts from its final video and (mode=upload) upload them privately, then schedule them
# at 8am and 6pm US Eastern, at least 24 hours after upload (rain-sounds pattern). Record: quizzes/<quiz>/shorts-upload.json.
on:
  # daily, after the 8am long-video upload: Shorts for the first quiz whose long video is scheduled and whose
  # Shorts aren't all uploaded yet (set repository variable AUTO_UPLOAD=false to pause, as for upload.yml)
  schedule:
    - cron: "30 9 * * *"
      timezone: "Australia/Sydney"
  # a commit that changes quizzes/<quiz>/shorts-request.json ({"mode": "upload", "only": "2,3"}) on a branch also runs it
  push:
    branches-ignore: [main]
    paths: ["quizzes/*/shorts-request.json"]
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder, e.g. quiz-09"
        required: true
      mode:
        description: "preview = make the Shorts and show the titles only; upload = upload and schedule; replace = re-make and re-upload Shorts not yet live (old uploads unscheduled, kept private)"
        type: choice
        options: [preview, upload, retitle, defaults, replace]
        default: preview
      only:
        description: "Short numbers to make, e.g. 2,3,4,5,6,7 (blank = all not already uploaded)"
        default: ""
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  shorts:
    if: github.event_name != 'schedule' || vars.AUTO_UPLOAD != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Which quiz
        env:
          IN_QUIZ: ${{ inputs.quiz }}
          IN_MODE: ${{ inputs.mode }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            # first quiz whose long video is scheduled and that has no Shorts record, or an unfinished one.
            # A record whose Shorts are all scheduled is left alone (Shorts Giulia posted by hand aren't redone).
            pick=""
            for f in quizzes/*/quiz.json; do
              q=$(basename "$(dirname "$f")")
              [ "$(jq -r '.review.video.decision // empty' "$f")" = approved ] || continue
              [ "$(jq -r '.status // empty' "quizzes/$q/upload.json" 2>/dev/null)" = scheduled ] || continue
              s="quizzes/$q/shorts-upload.json"
              if [ ! -f "$s" ] || [ "$(jq '[.shorts[]? | select(.status != "scheduled")] | length' "$s")" != 0 ]; then
                pick=$q; break
              fi
            done
            if [ -z "$pick" ]; then echo "No Shorts to make today." | tee -a "$GITHUB_STEP_SUMMARY"; echo "QUIZ=" >> "$GITHUB_ENV"; exit 0; fi
            echo "Daily Shorts: $pick" | tee -a "$GITHUB_STEP_SUMMARY"
            { echo "QUIZ=$pick"; echo "MODE=upload"; echo "ONLY="; } >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = push ]; then
            # only a request changed on this branch (not one that arrived by merging main)
            git fetch -q --depth=50 origin main || true
            f=""
            for c in $(git diff --name-only "${{ github.event.before }}" HEAD -- 'quizzes/*/shorts-request.json' 2>/dev/null); do
              git diff --quiet origin/main HEAD -- "$c" 2>/dev/null && continue
              f=$c; break
            done
            if [ -z "$f" ]; then echo "No new Shorts request on this branch; nothing to do."; echo "QUIZ=" >> "$GITHUB_ENV"; exit 0; fi
            q=$(basename "$(dirname "$f")")
            { echo "QUIZ=$q"; echo "MODE=$(jq -r '.mode // "preview"' "$f")"; echo "ONLY=$(jq -r '.only // ""' "$f")"; } >> "$GITHUB_ENV"
          else
            { echo "QUIZ=$IN_QUIZ"; echo "MODE=$IN_MODE"; echo "ONLY=$IN_ONLY"; } >> "$GITHUB_ENV"
          fi

      - name: Fonts and tools
        if: env.QUIZ != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg >/dev/null
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo curl -fsSL -o /usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          pip install -q pillow==11.0.0

      - name: Download the final video
        if: env.QUIZ != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$QUIZ" in ""|*/*|*..*) echo "Invalid quiz folder"; exit 1;; esac
          tag=$(jq -r '.review.video.release_tag' "quizzes/$QUIZ/quiz.json")
          d="$RUNNER_TEMP/build"; mkdir -p "$d"
          gh release download "$tag" -D "$d" -p "$QUIZ.mp4" -p "$QUIZ.srt" -p build_report.json
          for t in $(jq -r '[.review.video.release_tag] + [.review.video.history[]?.release_tag] | .[] | select(. != null)' "quizzes/$QUIZ/quiz.json"); do
            gh release download "$t" -D "$d" -p thumbnail-a.jpg 2>/dev/null && break
          done
          echo "TAG=$tag" >> "$GITHUB_ENV"; ls -la "$d"

      - name: Make Shorts
        if: env.QUIZ != '' && (env.MODE != 'retitle' && env.MODE != 'defaults')
        run: |
          d="$RUNNER_TEMP/build"
          python3 scripts/make_shorts.py --video "$d/$QUIZ.mp4" --report "$d/build_report.json" \
            --captions "$d/$QUIZ.srt" --quiz "quizzes/$QUIZ/quiz.json" --out "$RUNNER_TEMP/shorts" ${ONLY:+--only "$ONLY"}
          ls -la "$RUNNER_TEMP/shorts"

      - name: Keep the Shorts on the build's draft release
        if: env.QUIZ != '' && (env.MODE != 'retitle' && env.MODE != 'defaults')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/shorts/*.mp4 --clobber

      - name: Upload and schedule
        if: env.QUIZ != ''
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail  # a failed upload must fail the run (Quiz #10, 9 Nov: the error was hidden by tee)
          thumb=""; [ -f "$RUNNER_TEMP/build/thumbnail-a.jpg" ] && thumb="$RUNNER_TEMP/build/thumbnail-a.jpg"
          python3 scripts/upload_shorts.py --quiz "quizzes/$QUIZ" --dir "$RUNNER_TEMP/shorts" \
            ${thumb:+--thumbnail "$thumb"} --mode "$MODE" | tee "$RUNNER_TEMP/shorts-plan.json"
          { echo "## $QUIZ Shorts: $MODE"; echo '```json'; cat "$RUNNER_TEMP/shorts-plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record result
        if: env.QUIZ != '' && (always() && (env.MODE == 'upload' || env.MODE == 'retitle' || env.MODE == 'defaults' || env.MODE == 'replace'))
        run: |
          f="quizzes/$QUIZ/shorts-upload.json"
          [ -f "$f" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f" "quizzes/$QUIZ/shorts.json"
          git commit -m "Shorts upload record for $QUIZ" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
