name: Upload to YouTube
# Uploads an APPROVED quiz video privately, then schedules it with publishAt (rain-sounds pattern).
# Daily at 8am Sydney: uploads the next approved quiz that has no upload yet (or resumes an unfinished one)
# to the next free Thu 3pm / Sun 1pm ET slot. Turn the daily run off with repository variable AUTO_UPLOAD=false.
# By hand: mode=preview (default) shows the title, description and schedule without contacting YouTube;
# mode=upload sends it. Each quiz is uploaded once; the result is committed to quizzes/<quiz>/upload.json.
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder, e.g. quiz-09"
        required: true
      mode:
        description: "preview = no YouTube calls; upload = upload privately and schedule"
        type: choice
        options: [preview, upload]
        default: preview
      publish_at:
        description: "'next' = next free Thu 3pm / Sun 1pm ET slot 3+ days ahead; blank = private, no schedule; or e.g. 2026-11-12T15:00 (US Eastern)"
        default: next
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name != 'schedule' || vars.AUTO_UPLOAD != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick quiz
        env:
          EVENT: ${{ github.event_name }}
          IN_QUIZ: ${{ inputs.quiz }}
          IN_MODE: ${{ inputs.mode }}
          IN_PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          if [ "$EVENT" != schedule ]; then
            { echo "QUIZ=$IN_QUIZ"; echo "MODE=$IN_MODE"; echo "PUBLISH_AT=$IN_PUBLISH_AT"; } >> "$GITHUB_ENV"
            exit 0
          fi
          # Daily run: first approved quiz with no upload, or with an unfinished upload that has a video ID.
          pick=""
          for f in quizzes/*/quiz.json; do
            q=$(basename "$(dirname "$f")")
            [ "$(jq -r '.review.video.decision // empty' "$f")" = approved ] || continue
            u="quizzes/$q/upload.json"
            if [ ! -f "$u" ]; then pick=$q; break; fi
            st=$(jq -r '.status // empty' "$u"); vid=$(jq -r '.video_id // empty' "$u")
            case "$st" in scheduled|private_unscheduled) continue;; esac
            if [ -z "$vid" ]; then echo "::warning::$q has an upload record without a video ID ($st). Check Studio and reconcile $u by hand."; continue; fi
            pick=$q; break
          done
          if [ -z "$pick" ]; then echo "Nothing to upload today." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "Daily upload: $pick" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "QUIZ=$pick"; echo "MODE=upload"; echo "PUBLISH_AT=next"; } >> "$GITHUB_ENV"

      - name: Check quiz
        if: env.QUIZ != ''
        run: |
          case "$QUIZ" in */*|*..*) echo "Invalid quiz folder"; exit 1;; esac
          f="quizzes/$QUIZ/quiz.json"; test -f "$f" || { echo "$f missing"; exit 1; }
          tag=$(jq -r '.review.video.release_tag // empty' "$f")
          [ "$(jq -r '.review.video.decision // empty' "$f")" = approved ] || { echo "::error::Final video not approved in $f"; exit 1; }
          test -n "$tag" || { echo "::error::No approved release_tag in $f"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Download approved build
        if: env.QUIZ != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/build"; mkdir -p "$d"
          if [ "$MODE" = upload ]; then pat=(-p "$QUIZ.mp4" -p "$QUIZ.srt" -p build_report.json); else pat=(-p build_report.json); fi
          gh release download "$TAG" -D "$d" "${pat[@]}"
          # thumbnail A (if attached by the Attach thumbnails workflow) becomes the starting thumbnail
          gh release download "$TAG" -D "$d" -p thumbnail-a.jpg 2>/dev/null || echo "No thumbnail-a.jpg on $TAG"
          ls -la "$d"

      - name: Check YouTube secrets
        if: env.QUIZ != '' && env.MODE == 'upload'
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for v in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see docs/sign-in.md)"; exit 1; }
          done

      - name: Upload
        if: env.QUIZ != ''
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          d="$RUNNER_TEMP/build"
          thumb=""; [ -f "$d/thumbnail-a.jpg" ] && thumb="$d/thumbnail-a.jpg"
          python3 scripts/upload_youtube.py --quiz "quizzes/$QUIZ" --report "$d/build_report.json" \
            --video "$d/$QUIZ.mp4" --captions "$d/$QUIZ.srt" ${thumb:+--thumbnail "$thumb"} \
            --publish-at "$PUBLISH_AT" --mode "$MODE" --out "$RUNNER_TEMP/plan.json"
          { echo "## $QUIZ: $MODE"; echo '```json'; cat "$RUNNER_TEMP/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record result
        if: always() && env.QUIZ != '' && env.MODE == 'upload'
        run: |
          f="quizzes/$QUIZ/upload.json"
          [ -f "$f" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Upload record for $QUIZ" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
