name: Find GIFs
# Searches GIPHY (Pixabay / Wikipedia-image fallbacks) for a quiz's gif_queries.json and commits
# gif_candidates.json + gifs_selected.json. On push it works out the quiz from the changed file.
on:
  push:
    branches: ["claude/**"]
    paths: ["quizzes/*/gif_queries.json"]
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder under quizzes/, e.g. quiz-09"
        required: true
permissions:
  contents: write
jobs:
  find:
    # Updating a quiz branch from main ("Merge ...") can carry other quizzes' gif_queries.json; skip those pushes.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick quiz
        env:
          IN_QUIZ: ${{ inputs.quiz }}
          BEFORE: ${{ github.event.before }}
        run: |
          q="$IN_QUIZ"
          # on push: the quiz whose gif_queries.json changed
          if [ -z "$q" ]; then
            # a brand-new branch has no "before" commit (all zeros), so compare it with main instead
            case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=$(git merge-base origin/main HEAD);; esac
            q=$(git diff --name-only "$BEFORE" HEAD -- 'quizzes/*/gif_queries.json' 2>/dev/null | head -1 | cut -d/ -f2)
            # on a claude/quiz-NN branch, only ever touch quiz-NN (never another quiz's picks)
            case "$GITHUB_REF_NAME" in claude/quiz-*)
              own="${GITHUB_REF_NAME#claude/}"
              if git diff --name-only "$BEFORE" HEAD -- "quizzes/$own/gif_queries.json" | grep -q .; then q="$own"
              else echo "::notice::No change to quizzes/$own/gif_queries.json on this branch; nothing to do"; exit 0; fi;;
            esac
          fi
          case "$q" in ""|*..*|*/*) echo "Invalid or missing quiz '$q'"; exit 1;; esac
          echo "QUIZ=$q" >> "$GITHUB_ENV"
      - name: ffprobe (clip lengths)
        if: env.QUIZ != ''
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Search
        if: env.QUIZ != ''
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/find_gifs.py "quizzes/$QUIZ/gif_queries.json"
      - name: Commit
        if: always() && env.QUIZ != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in gif_candidates.json gifs_selected.json gif_search_cache.json gif_durations.json; do
            [ -f "quizzes/$QUIZ/$f" ] && git add "quizzes/$QUIZ/$f"
          done
          git commit -m "Add GIF candidates for $QUIZ" || exit 0
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
