name: Find GIFs
# Searches GIPHY (Pixabay fallback) for a quiz's gif_queries.json and commits gif_candidates.json.
on:
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder under quizzes/, e.g. quiz-09"
        required: true
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          QUIZ: ${{ inputs.quiz }}
        run: |
          case "$QUIZ" in *..*|*/*) echo "Invalid quiz"; exit 1;; esac
          python scripts/find_gifs.py "quizzes/$QUIZ/gif_queries.json"
      - name: Commit
        env:
          QUIZ: ${{ inputs.quiz }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "quizzes/$QUIZ/gif_candidates.json"
          git commit -m "Add GIF candidates for $QUIZ" || exit 0
          git push
