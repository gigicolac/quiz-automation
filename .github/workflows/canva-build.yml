name: Canva build
# Builds a quiz's question slides from the Canva brand templates through the Connect API
# (upload GIFs -> autofill one 2-page design per question -> export MP4), using quizzes/<quiz>/build.json "canva_build".
# Use "questions" for a quick test (e.g. "3 21 32"): the pairs and a still of each page are attached to the run
# as an artifact. A full run is part of the Build video workflow; this one doesn't touch YouTube.
on:
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz folder, e.g. quiz-10"
        required: true
      questions:
        description: "Question numbers to build (space-separated); blank = all"
        default: ""
      quality:
        description: "Export quality for this run"
        type: choice
        options: [horizontal_1080p, horizontal_4k]
        default: horizontal_1080p
permissions:
  contents: read
concurrency:
  group: canva   # Canva refresh tokens rotate: one Canva job at a time
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Build in Canva
        env:
          CANVA_CLIENT_ID: ${{ vars.CANVA_CLIENT_ID || secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          QUIZ: ${{ inputs.quiz }}
          ONLY: ${{ inputs.questions }}
          QUALITY: ${{ inputs.quality }}
        run: |
          case "$QUIZ" in */*|*..*|"") echo "Invalid quiz"; exit 1;; esac
          b="quizzes/$QUIZ/build.json"
          jq --arg q "$QUALITY" '.canva_build.quality = $q' "$b" > "$RUNNER_TEMP/build.json"
          cp "$RUNNER_TEMP/build.json" "$b"
          python3 scripts/canva_build.py --quiz "quizzes/$QUIZ" --out "$RUNNER_TEMP/canva" ${ONLY:+--only $ONLY}
      - name: Stills for review
        run: |
          d="$RUNNER_TEMP/canva"; mkdir -p "$d/stills"
          for f in "$d"/pairs/[0-9][0-9][0-9].mp4; do
            n=$(basename "$f" .mp4); dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -v error -y -ss 2 -i "$f" -frames:v 1 -vf scale=960:-1 "$d/stills/$n-question.jpg"
            ffmpeg -v error -y -ss "$(echo "$dur - 1" | bc)" -i "$f" -frames:v 1 -vf scale=960:-1 "$d/stills/$n-answer.jpg"
          done
          ls -la "$d" "$d/stills"
      - uses: actions/upload-artifact@v4
        with:
          name: canva-${{ inputs.quiz }}
          path: |
            ${{ runner.temp }}/canva/pairs/[0-9][0-9][0-9].mp4
            ${{ runner.temp }}/canva/stills/
            ${{ runner.temp }}/canva/canva_state.json
          retention-days: 14
